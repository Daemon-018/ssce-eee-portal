<!DOCTYPE html>
<html>
<head>
    <title>Admin File Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .editor-container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        textarea { width: 100%; height: 600px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .toolbar { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-save { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="toolbar">
            <h2>Editing: {{ filepath }}</h2>
            <form method="POST">
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
        <form method="POST">
            <textarea name="content">{{ content }}</textarea>
            <button type="submit" class="btn-save" style="margin-top:10px; width: 100%;">Save Changes</button>
        </form>
        <br>
        <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </div>
</body>
</html>
