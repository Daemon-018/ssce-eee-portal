{% extends "base.html" %}
{% block title %}Manage Faculty{% endblock %}
{% block content %}
<section class="page-section">
  <div class="container">
    <div class="page-head">
      <div class="eyebrow">Admin</div>
      <h1>Manage Faculty Profiles</h1>
      <p class="muted">Add, edit, or remove faculty profiles shown on the site.</p>
    </div>

    <details class="card manage-add-card" {% if not faculty %}open{% endif %}>
      <summary class="manage-add-summary">+ Add New Faculty</summary>
      <form method="POST" class="manage-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="fid" value="">
        <div class="form-row">
          <div><label class="slot-label">Full Name</label><input class="input" name="name" required></div>
          <div><label class="slot-label">Photo (e.g. 01_hod.jpg)</label><input class="input" name="photo" placeholder="images/faculty/01_hod.jpg"></div>
        </div>
        <div class="form-row">
          <div><label class="slot-label">Designation</label><input class="input" name="designation"></div>
          <div><label class="slot-label">Qualification</label><input class="input" name="qualification" placeholder="M.Tech, Ph.D."></div>
        </div>
        <div class="form-row">
          <div><label class="slot-label">Experience</label><input class="input" name="experience" placeholder="10+ years"></div>
          <div><label class="slot-label">Joined Year</label><input class="input" name="joined_year" placeholder="2015"></div>
        </div>
        <div><label class="slot-label">Bio</label><textarea class="input" name="bio" rows="2"></textarea></div>
        <div class="form-row">
          <div><label class="slot-label">Research (comma separated)</label><input class="input" name="research" placeholder="Power Systems, Renewable Energy"></div>
          <div><label class="slot-label">Subjects (comma separated)</label><input class="input" name="subjects" placeholder="Electrical Machines, Power Electronics"></div>
        </div>
        <div class="form-row">
          <div><label class="slot-label">Achievements</label><input class="input" name="achievements" placeholder="Ph.D., 15+ years experience"></div>
          <div><label class="slot-label">Email</label><input class="input" name="email"></div>
        </div>
        <div class="form-row">
          <div><label class="slot-label">Cabin</label><input class="input" name="cabin" placeholder="Block A - Room 204"></div>
          <div><label class="slot-label">Sort Order</label><input class="input" name="sort_order" type="number" value="0"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-save" type="submit">Save Faculty</button>
        </div>
      </form>
    </details>

    <div class="man-list">
      {% for f in faculty %}
      <details class="card man-row">
        <summary class="man-summary">
          <img class="man-thumb" src="{{ url_for('static', filename='images/faculty/' ~ f.photo) }}" alt="">
          <span class="man-name"><b>{{ f.name }}</b><small>{{ f.designation }}</small></span>
          <a class="man-preview" href="{{ url_for('faculty_detail', slug=f.slug) }}" target="_blank">View →</a>
        </summary>
        <form method="POST" class="manage-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="fid" value="{{ f.id }}">
          <div class="form-row">
            <div><label class="slot-label">Full Name</label><input class="input" name="name" value="{{ f.name }}" required></div>
            <div><label class="slot-label">Photo</label><input class="input" name="photo" value="{{ f.photo }}"></div>
          </div>
          <div class="form-row">
            <div><label class="slot-label">Designation</label><input class="input" name="designation" value="{{ f.designation }}"></div>
            <div><label class="slot-label">Qualification</label><input class="input" name="qualification" value="{{ f.qualification }}"></div>
          </div>
          <div class="form-row">
            <div><label class="slot-label">Experience</label><input class="input" name="experience" value="{{ f.experience }}"></div>
            <div><label class="slot-label">Joined Year</label><input class="input" name="joined_year" value="{{ f.joined_year }}"></div>
          </div>
          <div><label class="slot-label">Bio</label><textarea class="input" name="bio" rows="2">{{ f.bio }}</textarea></div>
          <div class="form-row">
            <div><label class="slot-label">Research</label><input class="input" name="research" value="{{ f.research | join(', ') }}"></div>
            <div><label class="slot-label">Subjects</label><input class="input" name="subjects" value="{{ f.subjects | join(', ') }}"></div>
          </div>
          <div class="form-row">
            <div><label class="slot-label">Achievements</label><input class="input" name="achievements" value="{{ f.achievements | join(', ') }}"></div>
            <div><label class="slot-label">Email</label><input class="input" name="email" value="{{ f.email }}"></div>
          </div>
          <div class="form-row">
            <div><label class="slot-label">Cabin</label><input class="input" name="cabin" value="{{ f.cabin }}"></div>
            <div><label class="slot-label">Sort Order</label><input class="input" name="sort_order" type="number" value="{{ f.sort_order }}"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-save" type="submit">Update</button>
            <button class="btn btn-outline" type="submit" formaction="{{ url_for('faculty_delete', fid=f.id) }}" onclick="return confirm('Delete {{ f.name }}?');">Delete</button>
          </div>
        </form>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
